# Winbond 8Gbit SPI NAND (carrier board)
# Model: W25N08LW
# Page size: 4096 bytes, block size: 256K, total: 1G (2 LUNs, both exposed by driver)
flash nand-1G-256k {
	pebsize = 256K
	lebsize = 253952
	numpebs = 4096
	minimum-io-unit-size = 4096
	vid-header-offset = 4096
	sub-page-size = 4096
}

image overlay.ubifs {
	ubifs {
		space-fixup = true
	}
	flashtype = "nand-1G-256k"
	size = 32M
	empty = true
}

image data.ubifs {
	ubifs {
		space-fixup = true
	}
	flashtype = "nand-1G-256k"
	size = 8M
	empty = true
}

image nand.img {
	ubi {}
	flashtype = "nand-1G-256k"

	partition u-boot-spl {
		image = "u-boot-spl.ldr"
		size = 256K
		read-only = true
	}

	partition u-boot {
		image = "u-boot.ldr"
		size = 768K
		read-only = true
	}

	partition kernel {
		image = "kernel.itb"
		size = 16M
		read-only = true
	}

	partition rootfs {
		image = "rootfs.erofs"
		size = 64M
		read-only = true
	}

	partition overlay {
		image = "overlay.ubifs"
		size = 32M
	}

	partition data {
		image = "data.ubifs"
		autoresize = true
	}
}
